# Lokalne usługi deweloperskie. Aplikacja uruchamiana przez `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding"]
      interval: 5s
      retries: 10

  # Magazyn zgodny z S3 (MinIO nie publikuje już obrazów Dockera). Bez skonfigurowanych
  # tożsamości SeaweedFS akceptuje dowolne klucze: tylko do developmentu.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -s3.port=8333 -volume.max=10
    ports:
      - "9010:8333"
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1035:1025" # SMTP
      - "8035:8025" # UI: http://localhost:8035

volumes:
  pgdata:
  s3data:
